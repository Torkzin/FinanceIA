name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: finance_ai_test
          POSTGRES_USER: finance_ai
          POSTGRES_PASSWORD: finance_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ai -d finance_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://finance_ai:finance_ai_test@localhost:5432/finance_ai_test
      JWT_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "./apps/api[dev]"

      - name: Validate database migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check

      - name: Lint backend
        run: ruff check apps/api

      - name: Test backend with coverage
        working-directory: apps/api
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm run lint:web
          npm run build:web
          npm run typecheck:web

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

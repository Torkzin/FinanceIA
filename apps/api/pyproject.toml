[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ai-api"
version = "0.1.0"
description = "FinanceAI REST API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "email-validator==2.3.0",
  "fastapi==0.142.2",
  "langgraph==1.2.12",
  "openai==3.22.1",
  "pgvector==0.5.0",
  "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.13.1",
  "PyJWT==2.15.1",
  "python-multipart==0.0.32",
  "pypdf==6.19.0",
  "sqlalchemy[asyncio]==2.1.1",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

